    device: *elec

  # ============================================================ 02000002 - gas
  # 100 imp/m3 - the standard reed contact on a domestic gas meter's 0.01 m3
  # digit, which is what gives the unit: m3 = m15 / m25.
  #
  # This counts from whenever the sensor was paired, not from the meter's dial.
  # To make the entity mirror the physical meter face, read the dial and set
  # `offset` below to (dial reading - current entity value). Note that if the
  # sensor's own counter is ever reset, the offset becomes wrong - so leave it
  # at 0 unless you actually need the absolute figure. The Energy dashboard
  # does not care: it only needs the value to increase.
  - name: "Volume"
    unique_id: em_0123456789ABCDEF_02000002_total
    state_topic: "sn/0123456789ABCDEF/data"
    device_class: gas
    state_class: total_increasing
    unit_of_measurement: "m³"
    suggested_display_precision: 2
    value_template: >-
      {%- if value_json.u == '02000002' -%}
      {%- set offset = 0 -%}
      {%- set p = value_json.s | selectattr('m', 'eq', 15) | list -%}
      {%- set c = value_json.s | selectattr('m', 'eq', 25) | list -%}
      {{ (offset + p[0].v[0] / c[0].v[0]) | round(4) if p and c and c[0].v[0] else this.state }}
      {%- else -%}
      {{ this.state }}
      {%- endif -%}
    availability_topic: "sn/0123456789ABCDEF/status"
    payload_available: "connected"
    payload_not_available: "disconnected"
    device: &meter2
      identifiers: ["em_sensor_02000002"]
      name: "EnergoMonitor gas"
      manufacturer: Energomonitor
      model: "Pulse sensor (type 2, 100 imp/m³)"
      via_device: "em_0123456789ABCDEF"

  - name: "Pulses"
    unique_id: em_0123456789ABCDEF_02000002_pulses
    state_topic: "sn/0123456789ABCDEF/data"
    state_class: total_increasing
    entity_category: diagnostic
