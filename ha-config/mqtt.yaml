  # ==================================================== Homebase diagnostics
  # State is the serial of whichever sensor reported last; the full decoded
  # payload sits in attributes.  This is how you notice a NEW sensor, a channel
  # reassignment, or an unknown medium code without reading logs.
  - name: "Last reading"
    unique_id: em_0123456789ABCDEF_last
    state_topic: "sn/0123456789ABCDEF/data"
    value_template: "{{ value_json.u }}"
    json_attributes_topic: "sn/0123456789ABCDEF/data"
    json_attributes_template: >-
      {{ {'serial': value_json.u,
          'channel': value_json.ch,
          'hw_type': value_json.d,
          'format': value_json.f,
          'sequence': value_json.e,
          'flags': value_json.v,
          'reported_at': value_json.t | timestamp_local,
          'measurements': value_json.s} | tojson }}
    entity_category: diagnostic
    device: &homebase
      identifiers: ["em_0123456789ABCDEF"]
      name: "EnergoMonitor Homebase"
      manufacturer: Energomonitor
      model: EWG6
      sw_version: "31.0-EWG6"

binary_sensor:
  - name: "Online"
    unique_id: em_0123456789ABCDEF_online
    state_topic: "sn/0123456789ABCDEF/status"
    payload_on: "connected"
    payload_off: "disconnected"
    device_class: connectivity
    entity_category: diagnostic
    device: *homebase
