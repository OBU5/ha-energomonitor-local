  - name: "Signal"
    unique_id: em_0123456789ABCDEF_01000001_rssi
    state_topic: "sn/0123456789ABCDEF/data"
    device_class: signal_strength
    state_class: measurement
    unit_of_measurement: "dBm"
    entity_category: diagnostic
    value_template: >-
